<style>
    /* ---------------- SIDEBAR ---------------- */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 280px;
        background-color: #1a1a1a;
        /* Dark background */
        color: #a1a1aa;
        /* Gray text */
        display: flex;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
        z-index: 100;
        overflow-y: auto;
    }

    /* BRAND / LOGO */
    .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 40px;
        color: white;
    }

    .brand-icon {
        width: 40px;
        height: 40px;
        background-color: #ea580c;
        /* Orange */
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
    }

    .brand-text {
        display: flex;
        flex-direction: column;
    }

    .brand-title {
        font-weight: 700;
        font-size: 18px;
        line-height: 1.2;
    }

    .brand-subtitle {
        font-size: 12px;
        color: #a1a1aa;
    }

    /* NAVIGATION */
    .nav-section {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 8px;
        color: #a1a1aa;
        text-decoration: none;
        transition: all 0.2s;
        font-size: 14px;
        font-weight: 500;
    }

    .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: white;
    }

    .nav-link.active {
        background-color: #ea580c;
        /* Orange */
        color: white;
    }

    .nav-link i {
        width: 20px;
        text-align: center;
        font-size: 16px;
    }

    .nav-category {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #525252;
        margin: 24px 0 8px 16px;
    }

    /* FOOTER / USER PROFILE */
    .sidebar-footer {
        margin-top: auto;
        background-color: #262626;
        border-radius: 12px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .user-details {
        display: flex;
        flex-direction: column;
    }

    .user-name {
        color: white;
        font-size: 14px;
        font-weight: 600;
    }

    .logout-btn {
        color: #a1a1aa;
        font-size: 18px;
        cursor: pointer;
        background: none;
        border: none;
        padding: 4px;
        transition: color 0.2s;
    }

    .logout-btn:hover {
        color: white;
    }
</style>

<div class="sidebar">
    <!-- Brand -->
    <div class="sidebar-brand">
        <a href="{% url 'superadmin_dashboard' %}"
            style="text-decoration: none; display: flex; align-items: center; gap: 12px; color: inherit;">
            {% load static %}
            <img src="{% static 'frontend/images/logo.png' %}" alt="RHMS Logo"
                style="width: 40px; height: 40px; border-radius: 8px;">
            <div class="brand-text">
                <div class="brand-title">RHMS</div>
                <div class="brand-subtitle">Hospital Management</div>
            </div>
        </a>
    </div>

    <!-- Navigation -->
    <div class="nav-section">
        <a href="{% url 'superadmin_dashboard' %}"
            class="nav-link {% if request.resolver_match.url_name == 'superadmin_dashboard' %}active{% endif %}">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
        </a>
        <a href="{% url 'pending_approvals' %}"
            class="nav-link {% if request.resolver_match.url_name == 'pending_approvals' %}active{% endif %}">
            <i class="fas fa-clipboard-check"></i>
            <span>Pending Approvals</span>
        </a>
        <a href="{% url 'user_management' %}"
            class="nav-link {% if request.resolver_match.url_name == 'user_management' %}active{% endif %}">
            <i class="fas fa-users"></i>
            <span>User Management</span>
        </a>
        <a href="{% url 'appointment_management' %}"
            class="nav-link {% if request.resolver_match.url_name == 'appointment_management' %}active{% endif %}">
            <i class="fas fa-calendar-check"></i>
            <span>Appointments</span>
        </a>

        <div class="nav-category">SETTINGS</div>

        <a href="#" class="nav-link">
            <i class="fas fa-cog"></i>
            <span>General Settings</span>
        </a>

    </div>

    <!-- Footer -->
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-details">
                <span class="user-name">{{ request.user.first_name|default:request.user.email }}</span>
            </div>
        </div>
        <form id="logout-form" action="{% url 'logout' %}" method="post" style="display: none;">
            {% csrf_token %}
        </form>
        <button class="logout-btn" onclick="document.getElementById('logout-form').submit();" title="Logout">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </div>
</div>
