{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Doctor Registration</h2>
    <form method="post" enctype="multipart/form-data" action="{% url 'register_doctor' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
            <label for="contact_number" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="contact_number" name="contact_number" required>
        </div>

        <div class="mb-3">
            <label for="hospital" class="form-label">Select Hospital</label>
            <select class="form-select" id="hospital" name="hospital" required>
                <option value="" selected disabled>Choose a hospital...</option>
                {% for hospital in hospitals %}
                <option value="{{ hospital.id }}">{{ hospital.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="specialization" class="form-label">Specialization</label>
            <input type="text" class="form-control" id="specialization" name="specialization" required>
        </div>

        <div class="mb-3">
            <label for="qualification" class="form-label">Qualification</label>
            <input type="text" class="form-control" id="qualification" name="qualification" required>
        </div>

        <div class="mb-3">
            <label for="year_of_experience" class="form-label">Years of Experience</label>
            <input type="number" class="form-control" id="year_of_experience" name="year_of_experience" required>
        </div>

        <div class="mb-3">
            <label for="aadhaar" class="form-label">Aadhaar Number</label>
            <input type="text" class="form-control" id="aadhaar" name="aadhaar" required>
        </div>

        <!-- Additional fields as per model -->
        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="date_of_birth" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
        </div>

        <!-- File Uploads -->
        <div class="mb-3">
            <label for="medical_certificate" class="form-label">Medical Certificate</label>
            <input type="file" class="form-control" id="medical_certificate" name="medical_certificate" required>
        </div>
        <div class="mb-3">
            <label for="registration_certificate" class="form-label">Registration Certificate</label>
            <input type="file" class="form-control" id="registration_certificate" name="registration_certificate"
                required>
        </div>
        <div class="mb-3">
            <label for="degree_certificates" class="form-label">Degree Certificates</label>
            <input type="file" class="form-control" id="degree_certificates" name="degree_certificates" required>
        </div>
        <div class="mb-3">
            <label for="passport_photo" class="form-label">Passport Photo</label>
            <input type="file" class="form-control" id="passport_photo" name="passport_photo" required>
        </div>
        <div class="mb-3">
            <label for="experience_certificate" class="form-label">Experience Certificate (Optional)</label>
            <input type="file" class="form-control" id="experience_certificate" name="experience_certificate">
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</div>
{% endblock %}
