version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rhms_prod_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rhms_prod_db}
      MYSQL_USER: ${DB_USER:-rhms_prod_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rhms_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    image: bgtuser/rhms:latest
    container_name: rhms_prod_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 revana_hms.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ${DB_NAME:-rhms_prod_db}
      DB_USER: ${DB_USER:-rhms_prod_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - rhms_prod_network

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  rhms_prod_network:
    driver: bridge
