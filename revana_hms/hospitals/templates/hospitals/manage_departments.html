{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Manage Departments</h2>

    <div class="card mb-4">
        <div class="card-header">Add New Department</div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="name" class="form-control" placeholder="Department Name" required>
                    <button type="submit" name="create" class="btn btn-primary">Add Department</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Existing Departments</div>
        <ul class="list-group list-group-flush">
            {% for department in departments %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ department.name }}
                <form method="post" style="display:inline;" onsubmit="return confirm('Are you sure?');">
                    {% csrf_token %}
                    <input type="hidden" name="department_id" value="{{ department.id }}">
                    <button type="submit" name="delete" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </li>
            {% empty %}
            <li class="list-group-item">No departments found.</li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
