<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHMS Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
background: linear-gradient(to top, #8b5e3c, #f0e2d3);
          /*  background-image: url("https://media.istockphoto.com/id/1057138932/photo/female-doctor-with-stethoscope-hand-pointing-touching-data-digital-icon-hologram-with-blurred.jpg?s=612x612&w=0&k=20&c=fiu4_8SLvaPz-VpJzLpd0eGM_oZajIJHBWhL0n981oI=");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(2px);*/
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: auto;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.72);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            padding: 40px 50px;
            text-align:center;
        }

        .title {
    text-align: center;
    font-size: 36px;
    font-weight: 600;
   color: #f3ede7;
    -webkit-text-stroke: 1.2px #875e39;

}

        .subtitle {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 40px;
            color: #555;
            font-size: 17px;
        }

        .cards {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
          width: 320px;
          padding: 40px;
          background: #fff;
          border-radius: 10px;
          position: relative;
          border: 2px solid #906a47;
          z-index: 1;
        }
        
                /* Animated border layer */
       

        .card img {
            width: 70px;
            margin-bottom: 20px;
        }

        .card h3 {
            color: #8b5e3c;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 80%;
            margin: 8px auto;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn {
            background: #8b5e3c;
            color: #fff;
        }

        .login-btn:hover {
            background: #8b5e3c;
        }

        .register-btn {
            background: transparent;
            border: 2px solid #8b5e3c;
            color: #8b5e3c;
        }

        .register-btn:hover {
            background: #8b5e3c;
            color: #fff;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            .title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <img src="	https://reevanax.com/wp-content/uploads/2022/08/ReevanaX-Final-Logo-CDR-1024x253.webp" width="300px" >	
    <div class="title">Hospital Management System</div>
    <div class="subtitle">Choose Your Access Type</div>

    <div class="cards">

        <!-- Hospital -->
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966483.png" alt="">
            <h3>Hospitals</h3>
            <p>Manage departments, staff, patient records & operations.</p>

     <a href="{% url 'hospital_login' %}" class="btn register-btn">Login</a>

        <a href="{% url 'hospital_register_page' %}" class="btn register-btn">Register</a>
        </div>

        <!-- Doctors -->
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/387/387561.png" alt="">
            <h3>Doctors</h3>
            <p>View appointments, patient details and schedules.</p>

              <a href="{% url 'doctor_login' %}" class="btn register-btn">Login</a>
              <a href="{% url 'doctor_register_page' %}" class="btn register-btn">Register</a>
        </div> 
    </div>

<br>
             <h4 style=" color: #8b5e3c;">Super Admin: <a href="{% url 'superadmin_login' %}" >Login</a></h3>
             
            
      
</div>

</body>
</html>
