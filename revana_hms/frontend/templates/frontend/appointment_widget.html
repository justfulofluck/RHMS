<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - RHMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(to top, #8b5e3c, #f0e2d3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .widget-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            padding: 40px;
            border: 2px solid #906a47;
        }

        .widget-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .widget-header h2 {
            color: #8b5e3c;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .widget-header p {
            color: #666;
            font-size: 14px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 2px;
            background: #ddd;
            z-index: 0;
        }

        .progress-step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            position: relative;
            z-index: 1;
        }

        .progress-step.active {
            background: #8b5e3c;
            color: #fff;
        }

        .progress-step.completed {
            background: #4CAF50;
            color: #fff;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #8b5e3c;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .slot-item {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff;
        }

        .slot-item:hover {
            border-color: #8b5e3c;
            background: #f9f5f1;
        }

        .slot-item.selected {
            background: #8b5e3c;
            color: #fff;
            border-color: #8b5e3c;
        }

        .slot-date {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .slot-time {
            font-size: 11px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn-primary {
            background: #8b5e3c;
            color: #fff;
        }

        .btn-primary:hover {
            background: #6d4a2e;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #8b5e3c;
            color: #8b5e3c;
        }

        .btn-secondary:hover {
            background: #8b5e3c;
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-message {
            text-align: center;
            padding: 30px;
        }

        .success-icon {
            font-size: 60px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .success-message h3 {
            color: #8b5e3c;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .token-display {
            background: #f9f5f1;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px dashed #8b5e3c;
        }

        .token-number {
            font-size: 48px;
            font-weight: 700;
            color: #8b5e3c;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #8b5e3c;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8b5e3c;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="widget-container">
        <div class="widget-header">
            <h2>📅 Book an Appointment</h2>
            <p>Follow the steps to schedule your visit</p>
        </div>

        <div class="progress-bar">
            <div class="progress-step active" data-step="1">1</div>
            <div class="progress-step" data-step="2">2</div>
            <div class="progress-step" data-step="3">3</div>
            <div class="progress-step" data-step="4">4</div>
            <div class="progress-step" data-step="5">5</div>
            <div class="progress-step" data-step="6">6</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <!-- Step 1: City -->
        <div class="form-step active" data-step="1">
            <div class="form-group">
                <label for="city">Select City</label>
                <select id="city" required>
                    <option value="">-- Choose a city --</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 2: Department -->
        <div class="form-step" data-step="2">
            <div class="form-group">
                <label for="department">Select Department</label>
                <select id="department" required>
                    <option value="">-- Choose a department --</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 3: Hospital -->
        <div class="form-step" data-step="3">
            <div class="form-group">
                <label for="hospital">Select Hospital</label>
                <select id="hospital" required>
                    <option value="">-- Choose a hospital --</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 4: Doctor -->
        <div class="form-step" data-step="4">
            <div class="form-group">
                <label for="doctor">Select Doctor</label>
                <select id="doctor" required>
                    <option value="">-- Choose a doctor --</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 5: Slot -->
        <div class="form-step" data-step="5">
            <div class="form-group">
                <label>Select Appointment Slot</label>
                <div class="slot-grid" id="slotGrid">
                    <div class="loading">Loading available slots...</div>
                </div>
                <input type="hidden" id="selectedSlot">
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" onclick="nextStep()">Next</button>
            </div>
        </div>

        <!-- Step 6: Patient Details -->
        <div class="form-step" data-step="6">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="your.email@example.com" required>
            </div>
            <div class="form-group">
                <label for="contactNumber">Contact Number *</label>
                <input type="tel" id="contactNumber" placeholder="10-digit mobile number" required>
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" onclick="confirmBooking()">Confirm Booking</button>
            </div>
        </div>

        <!-- Success Message -->
        <div class="form-step" data-step="7">
            <div class="success-message">
                <div class="success-icon">✅</div>
                <h3>Appointment Confirmed!</h3>
                <p>Your appointment has been successfully booked.</p>

                <div class="token-display">
                    <div style="font-size: 14px; color: #666; margin-bottom: 10px;">Your Token Number</div>
                    <div class="token-number" id="tokenNumber">-</div>
                </div>

                <p style="color: #666; font-size: 14px; margin-top: 15px;">
                    A confirmation email has been sent to your registered email address.
                </p>
            </div>
            <a href="/" class="back-link">← Back to Homepage</a>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const formData = {
            city: '',
            department: '',
            hospital: '',
            doctor: '',
            slot: ''
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadCities();
        });

        // API Calls
        async function loadCities() {
            try {
                const response = await fetch('/api/appointments/widget/cities/');
                const data = await response.json();
                const select = document.getElementById('city');
                select.innerHTML = '<option value="">-- Choose a city --</option>';
                data.cities.forEach(city => {
                    select.innerHTML += `<option value="${city}">${city}</option>`;
                });
            } catch (error) {
                showError('Failed to load cities');
            }
        }

        async function loadDepartments(city) {
            try {
                const response = await fetch(`/api/appointments/widget/departments/?city=${encodeURIComponent(city)}`);
                const data = await response.json();
                const select = document.getElementById('department');
                select.innerHTML = '<option value="">-- Choose a department --</option>';
                data.departments.forEach(dept => {
                    select.innerHTML += `<option value="${dept}">${dept}</option>`;
                });
            } catch (error) {
                showError('Failed to load departments');
            }
        }

        async function loadHospitals(city, department) {
            try {
                const response = await fetch(`/api/appointments/widget/hospitals/?city=${encodeURIComponent(city)}&department=${encodeURIComponent(department)}`);
                const data = await response.json();
                const select = document.getElementById('hospital');
                select.innerHTML = '<option value="">-- Choose a hospital --</option>';
                data.hospitals.forEach(hospital => {
                    select.innerHTML += `<option value="${hospital.id}">${hospital.name}</option>`;
                });
            } catch (error) {
                showError('Failed to load hospitals');
            }
        }

        async function loadDoctors(hospitalId, department) {
            try {
                const response = await fetch(`/api/appointments/widget/doctors/?hospital_id=${hospitalId}&department=${encodeURIComponent(department)}`);
                const data = await response.json();
                const select = document.getElementById('doctor');
                select.innerHTML = '<option value="">-- Choose a doctor --</option>';
                data.doctors.forEach(doctor => {
                    select.innerHTML += `<option value="${doctor.id}">${doctor.name} - ${doctor.specialization}</option>`;
                });
            } catch (error) {
                showError('Failed to load doctors');
            }
        }

        async function loadSlots(doctorId) {
            const grid = document.getElementById('slotGrid');
            grid.innerHTML = '<div class="loading">Loading available slots...</div>';

            try {
                const response = await fetch(`/api/appointments/widget/slots/?doctor_id=${doctorId}`);
                const data = await response.json();

                if (data.slots.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; color: #999;">No slots available</p>';
                    return;
                }

                grid.innerHTML = '';
                data.slots.forEach(slot => {
                    const slotDiv = document.createElement('div');
                    slotDiv.className = 'slot-item';
                    slotDiv.innerHTML = `
                <div class="slot-date">${new Date(slot.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
                <div class="slot-time">${slot.start_time}</div>
            `;
                    slotDiv.onclick = () => selectSlot(slot.id, slotDiv);
                    grid.appendChild(slotDiv);
                });
            } catch (error) {
                showError('Failed to load slots');
            }
        }

        function selectSlot(slotId, element) {
            document.querySelectorAll('.slot-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('selectedSlot').value = slotId;
            formData.slot = slotId;
        }

        async function confirmBooking() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const contactNumber = document.getElementById('contactNumber').value.trim();
            const slotId = document.getElementById('selectedSlot').value;

            if (!fullName || !email || !contactNumber) {
                showError('Please fill in all required fields');
                return;
            }

            if (!slotId) {
                showError('Please select a time slot');
                return;
            }

            try {
                const response = await fetch('/api/appointments/widget/book/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        contact_number: contactNumber,
                        slot_id: slotId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('tokenNumber').textContent = data.token_number;
                    goToStep(7);
                } else {
                    showError(data.error || 'Booking failed');
                }
            } catch (error) {
                showError('Failed to book appointment. Please try again.');
            }
        }

        // Navigation
        function nextStep() {
            const currentInput = document.querySelector(`.form-step[data-step="${currentStep}"] select, .form-step[data-step="${currentStep}"] input`);

            if (currentStep === 1) {
                const city = document.getElementById('city').value;
                if (!city) {
                    showError('Please select a city');
                    return;
                }
                formData.city = city;
                loadDepartments(city);
            } else if (currentStep === 2) {
                const dept = document.getElementById('department').value;
                if (!dept) {
                    showError('Please select a department');
                    return;
                }
                formData.department = dept;
                loadHospitals(formData.city, dept);
            } else if (currentStep === 3) {
                const hospital = document.getElementById('hospital').value;
                if (!hospital) {
                    showError('Please select a hospital');
                    return;
                }
                formData.hospital = hospital;
                loadDoctors(hospital, formData.department);
            } else if (currentStep === 4) {
                const doctor = document.getElementById('doctor').value;
                if (!doctor) {
                    showError('Please select a doctor');
                    return;
                }
                formData.doctor = doctor;
                loadSlots(doctor);
            } else if (currentStep === 5) {
                const slot = document.getElementById('selectedSlot').value;
                if (!slot) {
                    showError('Please select a time slot');
                    return;
                }
            }

            goToStep(currentStep + 1);
        }

        function prevStep() {
            goToStep(currentStep - 1);
        }

        function goToStep(step) {
            document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
            document.querySelector(`.form-step[data-step="${step}"]`).classList.add('active');

            document.querySelectorAll('.progress-step').forEach((s, i) => {
                s.classList.remove('active', 'completed');
                if (i + 1 < step) s.classList.add('completed');
                else if (i + 1 === step) s.classList.add('active');
            });

            currentStep = step;
            hideError();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>

</body>

</html>
