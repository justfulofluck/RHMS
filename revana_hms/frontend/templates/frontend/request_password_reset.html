{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Request Password Reset</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom, #cfa27e, #e9d7c3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-weight: 600;
        }

        .btn-submit {
            background-color: #c47f5b !important;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
        }

        .btn-submit:hover {
            background-color: #b36f4c !important;
        }
    </style>
</head>

<body>

    <div class="reset-card">
        <h2 class="mb-2 text-center">Forgot your password?</h2>
        <p class="text-muted mb-4 text-center">Enter your email and we'll send you a reset link.</p>

        <form id="resetRequestForm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <button style="color:white;font-weight:600" type="submit" class="btn btn-submit w-100">Send Reset
                Link</button>
        </form>

        <div id="message" class="mt-3"></div>
    </div>


    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrftoken = getCookie('csrftoken');

        document.getElementById('resetRequestForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageEl = document.getElementById('message');
            messageEl.innerHTML = '';

            try {
                const res = await fetch('/accounts/request-password-reset/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (res.ok) {
                    messageEl.innerHTML = '<div class="alert alert-success">If this email exists, a reset link has been sent.</div>';
                } else {
                    messageEl.innerHTML = `<div class="alert alert-danger">${data.error || 'Something went wrong.'}</div>`;
                }
            } catch (err) {
                messageEl.innerHTML = '<div class="alert alert-danger">Network error. Please try again.</div>';
            }
        });
    </script>

</body>

</html>
