<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Admin Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to top, #8b5e3c, #f0e2d3);
      font-family: 'Segoe UI', sans-serif;
    }

    .login-container {
      background: #fff;
      padding: 40px 35px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-title {
      font-weight: 600;
      font-size: 1.5rem;
      color: #8b5e3c;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: 500;
    }

    .form-control {
      border-radius: 8px;
      height: 45px;
    }

    .btn-login {
      background-color: #b87c5a;
      color: white;
      border-radius: 8px;
      font-weight: 500;
      padding: 10px;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    .btn-login:hover {
      background-color: #a86b4a;
    }

    .register-link a,
    .forgot-link a {
      color: #b87c5a;
      text-decoration: none;
      font-weight: 500;
    }

    .register-link a:hover,
    .forgot-link a:hover {
      text-decoration: underline;
    }

    .forgot-link {
      text-align: right;
      font-size: 0.9rem;
      margin-top: -10px;
      margin-bottom: 15px;
    }

    .alert {
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2 class="login-title">Hospital Admin Login</h2>
    <p class="login-subtitle">Welcome back! Please log in to continue.</p>

    <form method="POST" action="">
      {% csrf_token %}

      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email address</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required />
      </div>

      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required />
      </div>

      <div class="forgot-link">
        <a href="{% url 'request_password_reset_page' %}">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-login mt-3">Login</button>

      {% if messages %}
      <div class="mt-3">
        {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}

      <div class="register-link mt-3">
        Don’t have an account? <a href="{% url 'doctor_register_page' %}">Register as Hospital</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
