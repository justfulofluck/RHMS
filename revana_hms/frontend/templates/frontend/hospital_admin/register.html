                 <input
        type="text"

        placeholder="+91XXXXXXXXXX"
        maxlength="13"
        required
        oninput="allowPhoneNumber(this)">
              </div>

              <script>
                        function allowPhoneNumber(input) {
                          let value = input.value;

                          // Allow + only at the start
                          if (value.startsWith('+')) {
                            value = '+' + value.slice(1).replace(/[^0-9]/g, '');
                          } else {
                            value = value.replace(/[^0-9]/g, '');
                          }

                          // Limit to +91 + 10 digits OR 12 digits without +
                          if (value.startsWith('+')) {
                            value = value.slice(0, 13); // + + 12 digits
                          } else {
                            value = value.slice(0, 12);
                          }

                          input.value = value;
                        }
              </script>

/* ================= MATERIAL TIME PICKER ================= */
:root {

}

  <script>
class MaterialTimePicker {
  constructor() {
    this.activeInput = null;
    this.selectedHour = 12;  // Default 12
    this.selectedMinute = 0; // Default 00
    this.isAm = true;
    this.currentMode = 'hour';
    this.isDragging = false;
    
    this.init();
  }

  init() {
    this.bindHoursToggle();
    this.bindDaySelectors();
    this.bindTimeInputs();
    this.renderClock();
  }

  bindHoursToggle() {
    const hours247 = document.getElementById('hours247');
    const hoursMain = document.getElementById('hoursMain');
    const hoursSection = document.getElementById('hoursSection');
    
    hours247.onchange = hoursMain.onchange = () => {
      hoursSection.style.display = hoursMain.checked ? 'block' : 'none';
    };
  }

  bindDaySelectors() {
    document.querySelectorAll('.day-btn').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('active');
        const dayRow = document.getElementById(btn.dataset.day + 'Row');
        dayRow.style.display = btn.classList.contains('active') ? 'block' : 'none';
      };
    });
  }

  bindTimeInputs() {
    document.querySelectorAll('.time-input').forEach(input => {
      input.onclick = () => {
        this.activeInput = input;
        this.openPicker();
      };
    });
  }

  openPicker() {
    document.getElementById('timePickerOverlay').classList.remove('d-none');
    this.updateDisplay();
    this.updateHand();
  }

  closePicker() {
    document.getElementById('timePickerOverlay').classList.add('d-none');
    this.activeInput = null;
  }

  renderClock() {
    this.renderNumbers();
    this.setupEventListeners();
  }

  setupEventListeners() {
    // OK Button
    document.getElementById('btn-ok').onclick = () => {
      if (this.activeInput) {
        const time = `${this.selectedHour}:${String(this.selectedMinute).padStart(2,'0')} ${this.isAm ? 'AM' : 'PM'}`;
        this.activeInput.value = time;
      }
      this.closePicker();
    };

    // Cancel Button
    document.getElementById('btn-cancel').onclick = () => this.closePicker();

    // AM/PM Toggle
    document.querySelectorAll('.btn-am, .btn-pm').forEach(btn => {
      btn.onclick = () => {
        this.isAm = btn.dataset.period === 'AM';
        document.querySelectorAll('.btn-am').forEach(b => b.classList.toggle('active', this.isAm));
        document.querySelectorAll('.btn-pm').forEach(b => b.classList.toggle('active', !this.isAm));
      };
    });

    // Clock interactions
    this.setupDragging();
    this.bindDisplayClicks();
  }

  setupDragging() {
    const clockFace = document.querySelector('.clock-face');
    const clockHand = document.getElementById('clock-hand');

    const handleMove = (e) => {
      if (!this.isDragging) return;
      e.preventDefault();

      const rect = clockFace.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - centerX;
      const dy = clientY - centerY;

      let angle = Math.atan2(dx, -dy) * (180 / Math.PI);
      if (angle < 0) angle += 360;

      const total = this.currentMode === 'hour' ? 12 : 60;
      let val = Math.round((angle / 360) * total);

      if (this.currentMode === 'hour') {
        if (val === 0) val = 12;
        this.selectedHour = val;
      } else {
        if (val === 60) val = 0;
        this.selectedMinute = val;
      }

      this.updateDisplay();
      this.updateHand();
    };

    const startDragging = (e) => {
      this.isDragging = true;
      clockHand.classList.add('no-transition');
      handleMove(e);
    };

    const stopDragging = () => {
      if (this.isDragging) {
        clockHand.classList.remove('no-transition');
        if (this.currentMode === 'hour') {
          this.currentMode = 'minute';
          this.renderNumbers();
        }
      }
      this.isDragging = false;
    };

    // Mouse events
    clockFace.addEventListener('mousedown', startDragging);
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseup', stopDragging);

    // Touch events
    clockFace.addEventListener('touchstart', startDragging, { passive: false });
    document.addEventListener('touchmove', handleMove, { passive: false });
    document.addEventListener('touchend', stopDragging);
  }

  bindDisplayClicks() {
    document.getElementById('display-hour').onclick = () => {
      this.currentMode = 'hour';
      this.renderNumbers();
      this.updateDisplay();
      this.updateHand();
    };

    document.getElementById('display-minute').onclick = () => {
      this.currentMode = 'minute';
      this.renderNumbers();
      this.updateDisplay();
      this.updateHand();
    };
  }

  renderNumbers() {
    const clockNumbers = document.getElementById('clock-numbers');
    clockNumbers.innerHTML = '';
    const radius = 105;

    // Render ticks for minutes
    if (this.currentMode === 'minute') {
      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * (Math.PI / 180);
        const x = 125 + radius * Math.sin(angle) - 1;
        const y = 125 - radius * Math.cos(angle) - 1;

        const tick = document.createElement('div');
        tick.className = `clock-tick ${i % 5 === 0 ? 'major' : ''}`;
        tick.style.left = `${x}px`;
        tick.style.top = `${y}px`;
        clockNumbers.appendChild(tick);
      }
    }

    // Render numbers
    for (let i = 1; i <= 12; i++) {
      const val = this.currentMode === 'hour' ? i : (i * 5) % 60;
      const displayVal = (this.currentMode === 'minute' && val === 0) ? '00' : val;

      const angle = (i * 30) * (Math.PI / 180);
      const x = 125 + radius * Math.sin(angle) - 16;
      const y = 125 - radius * Math.cos(angle) - 16;

      const numDiv = document.createElement('div');
      numDiv.className = 'clock-number';
      numDiv.style.left = `${x}px`;
      numDiv.style.top = `${y}px`;
      numDiv.textContent = displayVal;
      numDiv.dataset.value = val;

      numDiv.addEventListener('click', (e) => {
        e.stopPropagation();
        if (this.currentMode === 'hour') {
          this.selectedHour = val;
          this.currentMode = 'minute';
          this.renderNumbers();
        } else {
          this.selectedMinute = val;
        }
        this.updateDisplay();
        this.updateHand();
      });

      clockNumbers.appendChild(numDiv);
    }
  }

  updateDisplay() {
    document.getElementById('display-hour').textContent = this.selectedHour;
    document.getElementById('display-minute').textContent = 
      this.selectedMinute.toString().padStart(2, '0');

    const hourEl = document.getElementById('display-hour');
    const minuteEl = document.getElementById('display-minute');
    
    if (this.currentMode === 'hour') {
      hourEl.classList.add('active');
      minuteEl.classList.remove('active');
    } else {
      hourEl.classList.remove('active');
      minuteEl.classList.add('active');
    }
  }

  updateHand() {
    const val = this.currentMode === 'hour' ? this.selectedHour : this.selectedMinute;
    const total = this.currentMode === 'hour' ? 12 : 60;
    const angle = (val / total) * 360;
    
    const clockHand = document.getElementById('clock-hand');
    clockHand.style.transform = `translateX(-50%) rotate(${angle}deg)`;

    const handTip = document.getElementById('hand-tip');
    handTip.textContent = this.currentMode === 'hour' ? 
      this.selectedHour : this.selectedMinute.toString().padStart(2, '0');
    handTip.style.transform = `rotate(${-angle}deg)`;
  }
}

  <script>
    // Toastr Options
    toastr.options = {
      "closeButton": true,
      "progressBar": true,
      "positionClass": "toast-top-right",
      "timeOut": "3000"
    };

    // --- Top Loading Bar Logic ---
    const loaderBar = document.getElementById('top-loading-bar');

    function startLoader() {
      loaderBar.style.opacity = '1';
      loaderBar.style.width = '30%';
      setTimeout(() => {
        if (loaderBar.style.width !== '100%') loaderBar.style.width = '70%';
      }, 500);
    }

    function stopLoader() {
      loaderBar.style.width = '100%';
      setTimeout(() => {
        loaderBar.style.opacity = '0';
        setTimeout(() => { loaderBar.style.width = '0%'; }, 400);
      }, 500);
    }

    // Show on Page Load
    startLoader();
    window.addEventListener('load', stopLoader);
    // -----------------------------

    document.getElementById('logo').addEventListener('change', function (e) {
      const file = this.files[0];
      if (file) {
        // do nothing: browser will show chosen filename in control
      }
    });

    // submit handler
    document.getElementById('hospitalForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      startLoader(); // Start loader on submit

      const form = e.target;
      const data = new FormData(form);

      try {
        const resp = await fetch('/api/register-hospital/', { method: 'POST', body: data });
        const json = await resp.json();

        if (resp.ok) {
          toastr.success(json.message || 'Registered successfully!');
          // Keep loader full while redirecting
          loaderBar.style.width = '100%';
          setTimeout(() => {
            window.location.href = "{% url 'hospital_login' %}";
          }, 2000);
        } else {
          stopLoader(); // Stop on error
          toastr.error(json.message || 'Error occurred');
        }
      } catch (err) {
        stopLoader(); // Stop on error
        console.error(err);
        toastr.error('Network error');
      }
    });
  </script>
