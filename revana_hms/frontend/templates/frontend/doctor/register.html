{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">Doctor Registration</h2>
  <form id="doctorRegistrationForm" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-6 mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Contact Number</label>
        <input type="text" name="contact_number" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Gender</label>
        <select name="gender" class="form-control" required>
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Aadhaar Number</label>
        <input type="text" name="aadhaar" class="form-control" required>
      </div>
      <div class="col-md-12 mb-3">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="2" required></textarea>
      </div>
      <div class="col-md-6 mb-3">
        <label>Qualification</label>
        <input type="text" name="qualification" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Specialization</label>
        <input type="text" name="specialization" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Years of Experience</label>
        <input type="number" name="year_of_experience" class="form-control" required>
      </div>

      <!-- File Uploads -->
      <div class="col-md-6 mb-3">
        <label>Medical Certificate</label>
        <input type="file" name="medical_certificate" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Registration Certificate</label>
        <input type="file" name="registration_certificate" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Degree Certificates</label>
        <input type="file" name="degree_certificates" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Passport Photo</label>
        <input type="file" name="passport_photo" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label>Experience Certificate</label>
        <input type="file" name="experience_certificate" class="form-control" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
  </form>

  <div id="formMessage" class="mt-3"></div>
</div>

<script>
  document.getElementById('doctorRegistrationForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);

    fetch("{% url 'register_doctor' %}", {
      method: 'POST',
      body: formData,
      headers: {
        'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value
      }
    })
      .then(response => response.json())
      .then(data => {
        const msgDiv = document.getElementById('formMessage');
        if (data.status === 'success') {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          form.reset();
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('formMessage').innerHTML = `<div class="alert alert-danger">Something went wrong.</div>`;
      });
  });
</script>
{% endblock %}
