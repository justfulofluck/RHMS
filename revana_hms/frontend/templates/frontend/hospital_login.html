<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Admin Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
            background: linear-gradient(to top, #cfa27e, #e9d7c3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 15px;
        }

        .login-container {
            background: #fff;
            padding: 40px 35px;
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-title {
            text-align: center;
            font-weight: 700;
            color: #8a5b3d;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-control {
            border-radius: 8px;
            height: 45px;
        }

        .btn-login {
            background-color: #c47f5b;
            color: white;
            border-radius: 8px;
            font-weight: 500;
            padding: 10px;
            width: 100%;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            background-color: #b36f4c;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #c47f5b;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot-link a {
            font-size: 0.9rem;
            color: #c47f5b;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 0.9rem;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="login-container">

        <h2 class="login-title">Hospital Admin Login</h2>
        <p class="login-subtitle">Welcome back! Please log in to continue.</p>

        <form method="POST" action="">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" id="email" class="form-control"
                    placeholder="Enter your email" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                    placeholder="Enter your password" required />
            </div>

            <div class="forgot-link">
                <a href="{% url 'request_password_reset_page' %}">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-login mt-2">Login</button>

            {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="register-link">
                <p class="mt-3 mb-0">
                    Don’t have an account?
                    <a href="{% url 'hospital_register_page' %}">Register as Hospital</a>
                </p>
            </div>

        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
