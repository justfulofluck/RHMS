<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Admin Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
      min-height: 100vh;
      background:
        linear-gradient(
          rgba(207, 162, 126, 0.75),
          rgba(233, 215, 195, 0.75)
        ),
        url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", sans-serif;
      padding: 15px;
    }
    .login-wrapper {
      width: 100%;
      max-width: 950px;
      background: #fff;
      border-radius: 16px;
      height: 650px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
    }


      .login-container {
      flex: 1;
      padding: 45px 40px;
      align-content: center;
    }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-title {
            text-align: center;
            font-weight: 700;
            color: #8a5b3d;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-control {
            border-radius: 8px;
            height: 45px;
        }

        .btn-login {
            background-color: #c47f5b;
            color: white;
            border-radius: 8px;
            font-weight: 500;
            padding: 10px;
            width: 100%;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            background-color: #b36f4c;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #c47f5b;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .forgot-link a {
            font-size: 0.9rem;
            color: #c47f5b;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .alert {
            font-size: 0.9rem;
            border-radius: 8px;
        }
        
        
        .login-image {
      flex: 1;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.1),
          rgba(0, 0, 0, 0.1)
        ),
        url("https://img.freepik.com/free-photo/beautiful-young-female-doctor-looking-camera-office_1301-7807.jpg?semt=ais_hybrid&w=740&q=80");
      background-size: cover;
      background-position: center;
      color: #fff;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    </style>
</head>

<body>
    
  <div class="login-wrapper">
       <div class="login-image">
      
    </div>
    <div class="login-container">

        <h2 class="login-title">Hospital Admin Login</h2>
        <p class="login-subtitle">Welcome back! Please log in to continue.</p>

        <form method="POST" action="">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email"
                    required />
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                    placeholder="Enter your password" required />
            </div>

            <div class="forgot-link">
                <a href="{% url 'request_password_reset_page' %}">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-login mt-2">Login</button>



            <div class="register-link">
                <p class="mt-3 mb-0">
                    Don’t have an account?
                    <a href="{% url 'hospital_register_page' %}">Register as Hospital</a>
                </p>
            </div>

        </form>
    </div>
</div>


    <!-- Toastr & JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        toastr.options = {
            "closeButton": true,
            "progressBar": true,
            "positionClass": "toast-top-right",
            "timeOut": "3000"
        };
        /* {% if messages %} */
        /* {% for message in messages %} */
        var type = "{{ message.tags }}";
        // Map Django tags to Toastr methods if needed, or rely on naming convention
        // Django: debug, info, success, warning, error
        // Toastr: info, success, warning, error
        if (type === 'debug') type = 'info';
        toastr[type] ? toastr[type]("{{ message }}") : toastr.info("{{ message }}");
        /* {% endfor %} */
        /* {% endif %} */
    </script>
</body>

</html>
